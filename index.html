<!DOCTYPE html>
<html lang="tr" data-m="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>İzleme Listem</title>
<style>
:root{--bg:#0e1015;--card:#181b23;--card2:#222633;--tx:#eef0f6;--mut:#8a91a6;--acc:#4d8dff;--on:#0b1020;--ok:#3ddc84;--okt:#86cfa4;--okon:#07140c;--donebg:#14211b;--doneep:#173024;--err:#ff8a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-c="f"]{--bg:#150e0f;--card:#231819;--card2:#2f2022;--acc:#ff6b6b;--on:#1a0809}
:root[data-c="d"]{--bg:#0d1510;--card:#17231b;--card2:#1f3025;--acc:#3ddc84;--on:#07140c;--donebg:#0f2d1c;--doneep:#143a24}
:root[data-c="o"]{--bg:#15130c;--card:#231f14;--card2:#302a1b;--acc:#ffd24a;--on:#1a1400}
:root[data-c="t"]{--bg:#120e17;--card:#1e1825;--card2:#2a2234;--acc:#b58cff;--on:#150b24}
:root[data-m="light"]{--bg:#eef2fb;--card:#fff;--card2:#e4e9f5;--tx:#1b1e29;--mut:#6a7186;--acc:#2563eb;--on:#fff;--ok:#16a34a;--okt:#1f7a45;--okon:#fff;--donebg:#e0f4e8;--doneep:#cdeed9;--err:#d33a3a}
:root[data-m="light"][data-c="f"]{--bg:#fbeff0;--card2:#f6dfe1;--acc:#e5484d;--on:#fff}
:root[data-m="light"][data-c="d"]{--bg:#edf8f0;--card2:#d9efe1;--acc:#16a34a;--on:#fff;--donebg:#d2efde;--doneep:#bde6cd}
:root[data-m="light"][data-c="o"]{--bg:#fbf6e2;--card2:#f3eac3;--acc:#cf9400;--on:#fff}
:root[data-m="light"][data-c="t"]{--bg:#f4effb;--card2:#e7dcf6;--acc:#8b5cf6;--on:#fff}
html{background-color:var(--bg);transition:background-color .5s;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,.t,.k,.tab,.chk,.chev,.del,.mbtn{-webkit-user-select:none;user-select:none;touch-action:manipulation}
a{-webkit-touch-callout:none}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--tx);font:20px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:24px 18px 60px}
h1{font-size:2em;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px;font-size:.8em;min-height:1.4em}
.tabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.tg{display:flex;gap:8px;flex-wrap:wrap}
.sep{width:2px;height:26px;border-radius:2px;background:var(--mut);opacity:.45;margin:0 6px}
.brk{display:none}
button,input,select{font:inherit;color:inherit}
.tab{background:var(--card);border:2px solid transparent;border-radius:999px;padding:8px 18px;cursor:pointer}
.tab.on{background:var(--acc);color:var(--on);font-weight:600}
.add{display:none;gap:8px;flex-wrap:wrap;background:var(--card);padding:12px;border-radius:16px;margin:0 0 18px}
body.edit .add{display:flex}
.add input,.add select{background:var(--card2);border:2px solid transparent;border-radius:12px;padding:10px 12px;min-width:0}
.add .n{flex:2 1 200px}.add .u{flex:3 1 240px}
.add button{background:var(--acc);color:var(--on);border:0;border-radius:12px;padding:10px 20px;font-weight:700;cursor:pointer}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.f,.g{position:relative;background:var(--card);border-radius:16px}
.f,.row,.ep{display:flex;align-items:center;gap:14px;padding:12px 14px}
.chk{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid var(--mut);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;transition:background .25s,border-color .25s,transform .25s}
.chk svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .35s .1s}
.done>.chk{background:var(--acc);border-color:var(--acc);transform:scale(1.08)}
.done>.chk svg{stroke-dashoffset:0}
.t{flex:0 1 auto;min-width:0;color:var(--tx);text-decoration:none;word-break:break-word;padding:4px 2px;border-radius:8px;border:0;text-align:left;cursor:pointer;position:relative;background:none;transition:color .35s}
.done .t{color:var(--mut)}
.ov{position:absolute;left:0;top:0;right:0;bottom:0;padding:4px 2px;color:transparent;pointer-events:none;text-decoration-line:line-through;-webkit-text-decoration-color:var(--acc);text-decoration-color:var(--acc);text-decoration-thickness:2.5px;opacity:0;-webkit-clip-path:inset(0 100% 0 0);clip-path:inset(0 100% 0 0);transition:clip-path .5s ease,-webkit-clip-path .5s ease,opacity 0s .5s}
.done .ov{opacity:1;-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0);transition:clip-path .5s ease,-webkit-clip-path .5s ease,opacity 0s 0s}
.ov .yr{background:transparent;color:transparent}
.done .tx .yr{opacity:.75}
.k{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;height:28px;padding:0 12px;font-size:.65em;color:var(--mut);border:1px solid var(--mut);border-radius:999px;text-decoration:none}
.k svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chev{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);border:0;color:var(--mut);cursor:pointer;padding:0;display:grid;place-items:center;justify-self:end}
.chev svg,.del svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chev svg{transition:transform .25s}
.g.open .chev svg{transform:rotate(180deg)}
.del{display:none;flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);border:0;color:var(--mut);cursor:pointer;padding:0;place-items:center;justify-self:end}
.ep .del{background:var(--card)}
body.edit .del{display:grid}
.del:hover{color:#ff6b6b}
.eps{display:none;padding:0 12px 12px 30px;animation:fade .25s}
.g.open .eps{display:block}
.eps ul{gap:6px}
.ep{background:var(--card2);border-radius:12px;padding:8px 12px}
.ep .chk{width:34px;height:34px}.ep .chk svg{width:20px;height:20px}
.eps .add{margin:10px 0 0;background:transparent;padding:0}
.noep{color:var(--mut);font-size:.8em;padding:4px 2px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.main{flex:1;min-width:0;display:flex;align-items:center;gap:14px}
.acts{display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap;margin-left:auto}
.prog{display:flex;align-items:center;gap:10px;padding:0 14px 12px 68px}
.bar{flex:1;height:8px;border-radius:999px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background-color:var(--acc);background-image:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.32));transition:width .6s cubic-bezier(.4,0,.2,1),background-color .4s}
.g.sdone .bar i{background-color:var(--ok)}
.pct{font-size:.62em;color:var(--mut);min-width:2.8em;text-align:right}
.sel{position:relative;flex:none}
.add .selbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:120px;background:var(--card2);color:var(--tx);border:2px solid transparent;border-radius:12px;padding:10px 14px;font-weight:400;cursor:pointer}
.selbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.sel.open .selbtn svg{transform:rotate(180deg)}
.add .sel.open .selbtn,.add .selbtn:focus-visible{border-color:var(--acc)}
.opts{position:absolute;left:0;top:calc(100% + 6px);min-width:100%;z-index:20;background:var(--card2);border-radius:14px;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.35);animation:fade .15s}
.add .opts button{display:block;width:100%;background:transparent;color:var(--tx);border:0;border-radius:10px;padding:10px 14px;text-align:left;font-weight:400;white-space:nowrap;cursor:pointer}
.add .opts button:hover{background:var(--card)}
.add .opts button.sel1{background:var(--acc);color:var(--on);font-weight:600}
.g>.row,.g>.prog{cursor:pointer}
:root{--dtx:#f08a82;--dbd:#a8332d;--dfill:#9b2020}
:root[data-m="light"]{--dtx:#b42318;--dbd:#e3a8a2;--dfill:#a82a24}
.ovl{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.58);animation:fadein .24s ease-out both}
.ovl.out{pointer-events:none;animation:fadeout .19s ease-in both}
.ovl.out .dlg{animation:popout .19s ease-in both}
.dlg{width:100%;max-width:340px;background:var(--card);border:1px solid var(--card2);border-radius:22px;padding:22px;text-align:center;box-shadow:0 18px 48px rgba(0,0,0,.42);animation:pop .3s cubic-bezier(.22,.9,.3,1) both}
.dico{width:48px;height:48px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:rgba(190,45,45,.15);color:var(--dtx)}
.dico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dlg h2{font-size:1.05em;margin:0 0 6px}
.dlg p{margin:0;color:var(--mut);font-size:.8em;word-break:break-word}
.dbtns{display:flex;gap:10px;margin-top:20px}
.dbtns button{flex:1;height:44px;border-radius:14px;font-weight:600;cursor:pointer}
.dno{background:var(--card2);color:var(--tx);border:1.5px solid transparent}
.dyes{background:transparent;color:var(--dtx);border:1.5px solid var(--dbd);transition:background-color .2s,color .2s,border-color .2s}
.dyes:hover,.dyes:active,.dyes:focus-visible{background:var(--dfill);border-color:var(--dfill);color:#fff}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate3d(0,14px,0) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes popout{from{opacity:1;transform:none}to{opacity:0;transform:translate3d(0,8px,0) scale(.98)}}
/* Tümü ve İzlenmedi görünümünde: nötr kart + soluk kategori rengi (sol çizgi ve hafif ışıma) */
.f::before,.g::before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;pointer-events:none;background:linear-gradient(90deg,var(--tint,transparent),transparent 55%)}
.f::after,.g::after{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--bar,transparent);pointer-events:none}
:root[data-c="a"] .k-f,:root[data-c="t"] .k-f{--acc:#ff6b6b;--on:#1a0809;--bar:#ff6b6b;--tint:rgba(255,107,107,.10)}
:root[data-c="a"] .k-d,:root[data-c="t"] .k-d{--acc:#3ddc84;--on:#07140c;--bar:#3ddc84;--tint:rgba(61,220,132,.10)}
:root[data-c="a"] .k-o,:root[data-c="t"] .k-o{--acc:#ffd24a;--on:#1a1400;--bar:#ffd24a;--tint:rgba(255,210,74,.10)}
:root[data-m="light"][data-c="a"] .k-f,:root[data-m="light"][data-c="t"] .k-f{--acc:#e5484d;--on:#fff;--bar:#e5484d;--tint:rgba(229,72,77,.09)}
:root[data-m="light"][data-c="a"] .k-d,:root[data-m="light"][data-c="t"] .k-d{--acc:#16a34a;--on:#fff;--bar:#16a34a;--tint:rgba(22,163,74,.10)}
:root[data-m="light"][data-c="a"] .k-o,:root[data-m="light"][data-c="t"] .k-o{--acc:#cf9400;--on:#fff;--bar:#cf9400;--tint:rgba(224,164,0,.13)}
:root{--star:#f6c344}
:root[data-m="light"]{--star:#e29f00}
.star{display:none;order:-2;flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);border:0;color:var(--mut);cursor:pointer;padding:0;place-items:center;justify-self:end;transition:opacity .28s,transform .28s,color .2s,background-color .2s}
.star svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:fill .2s}
.star:hover,.star.on{color:var(--star)}
.star.on svg{fill:currentColor}
.star.pop svg{animation:starpop .35s}
body.edit .star,.star.on{display:grid}
body:not(.edit) .star{pointer-events:none}
@keyframes starpop{0%{transform:scale(.6)}60%{transform:scale(1.28)}100%{transform:scale(1)}}
@media (hover:hover) and (pointer:fine){.star:not(.on){opacity:0;transform:scale(.85)}.f:hover .star,.g:hover .star,.star:focus-visible{opacity:1;transform:none}}
/* ★ Altın tema (yıldızlı içerikler) */
:root{--g1:#f2d675;--g2:#d4af37;--gtint:rgba(212,175,55,.20);--gline:rgba(212,175,55,.45)}
:root[data-m="light"]{--g1:#8a6414;--g2:#c79a1f;--gtint:rgba(199,154,31,.22);--gline:rgba(199,154,31,.55)}
:root[data-m] .fav.f,:root[data-m] .fav.g{--bar:var(--g2);--acc:var(--g2);--on:#1a1400;box-shadow:inset 0 0 0 1px var(--gline),0 8px 24px -12px var(--g2)}
.fav::before{background:linear-gradient(100deg,var(--gtint),rgba(212,175,55,.05) 70%,transparent)}
.f.fav:not(.done) .t,.g.fav:not(.sdone) .t{color:var(--g1)}
.fav .k{border-color:var(--gline);color:var(--g1)}
.fav .star.on{background:var(--gtint)}
.fav-in::before{animation:wipein .9s ease-out both}
.fav-in{animation:gfade .9s ease-out}
.fav-out::before{animation:wipeout .5s ease-in both}
.fav-out{animation:gfadeout .5s ease-in both}
.fav-out .t{color:var(--tx)!important}
@keyframes wipein{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes wipeout{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 100% 0 0)}}
@keyframes gfade{from{box-shadow:inset 0 0 0 1px transparent,0 8px 24px -12px transparent}}
@keyframes gfadeout{to{box-shadow:inset 0 0 0 1px transparent,0 8px 24px -12px transparent}}
/* izlendi: soldan sağa soluk siyah-beyaz, geri alınca sağdan sola eski rengine */
.f.gray,.g.gray{filter:grayscale(1);opacity:.58}
.f.gray:hover,.g.gray:hover{opacity:.9}
.gwipe{position:absolute;left:0;top:0;right:0;bottom:0;z-index:2;border-radius:inherit;background:#808080;mix-blend-mode:saturation;pointer-events:none}
.gin{animation:gin .8s ease-in-out both}
.gout{animation:gout .8s ease-in-out both}
@keyframes gin{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes gout{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 100% 0 0)}}
/* düzenle butonu + düzenleme penceresi */
.pen{display:none;flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);border:0;color:var(--mut);cursor:pointer;padding:0;place-items:center;justify-self:end;transition:color .2s,background-color .2s}
.pen svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.pen:hover{color:var(--acc)}
body.edit .pen{display:grid}
.ep .pen{background:var(--card)}
.dico.eico{background:var(--card2);color:var(--acc)}
.efield{text-align:left;margin-top:12px}
.efield label{display:block;font-size:.7em;color:var(--mut);margin:0 0 4px}
.efield input{width:100%;background:var(--card2);color:var(--tx);border:2px solid transparent;border-radius:12px;padding:12px;font:inherit;transition:border-color .2s}
.efield input:focus{outline:none;border-color:var(--acc)}
.dbtns .eyes{background:var(--acc);color:var(--on);border:1.5px solid transparent;transition:filter .2s,transform .15s}
.dbtns .eyes:hover{filter:brightness(1.1)}
.dbtns .eyes:active{transform:scale(.97)}
/* bölüm izlendi: yerinde kalır, soldan sağa soluk siyah-beyaz */
.ep{position:relative}
.ep.gray{filter:grayscale(1);opacity:.58}
.g.gray .ep.gray{opacity:1}
/* yıl etiketi */
.yr{display:inline-block;position:relative;margin-left:0;padding:1px 9px;border-radius:999px;background:var(--card2);color:var(--mut);font-size:.7em;font-weight:500;line-height:1.6;letter-spacing:.02em;vertical-align:.08em;font-variant-numeric:tabular-nums;white-space:nowrap}
.yr::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;margin-top:-1px;border-radius:2px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .3s ease 0s}
.done .tx .yr::after{transform:scaleX(1);transition:transform .3s ease .3s}
.ov .yr::after{display:none}
.fav .yr{background:var(--gtint);color:var(--g1)}
.add .y{flex:0 0 84px;text-align:center}
/* arşiv butonu + üç nokta menüsü */
.hb{display:flex;gap:8px;align-items:flex-start;flex:none}
#abtn{display:none}
body.edit #abtn{display:grid}
.mbtn.on{background:var(--acc);color:var(--on)}
body.arch #add{display:none!important}
.more{display:none;flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);border:0;color:var(--mut);cursor:pointer;padding:0;place-items:center;justify-self:end;transition:color .2s,background-color .2s}
.more svg{width:16px;height:16px;fill:currentColor;stroke:none}
.more:hover{color:var(--tx)}
body.edit .more{display:grid}
.ep .more{background:var(--card);margin-left:auto}
:root{--atx:#3fd0c0;--abd:#1b7f74;--arc:#1FA698}
:root[data-m="light"]{--atx:#13796e;--abd:#8fd1c9}
.imenu{position:fixed;z-index:40;min-width:172px;background:var(--card2);border:1px solid var(--card);border-radius:14px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.4);transform-origin:top right;animation:mpop .16s ease-out}
.imenu.up{transform-origin:bottom right}
.imenu button{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;color:var(--tx);padding:9px 12px;border-radius:9px;font-size:.78em;text-align:left;cursor:pointer;transition:background-color .15s,color .15s}
.imenu button:hover{background:var(--card)}
.imenu svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none;opacity:.9}
.imenu .marc:hover{background:rgba(31,166,152,.16);color:var(--atx)}
.imenu .mdel{color:var(--dtx)}
.imenu .mdel:hover{background:var(--dfill);color:#fff}
.dico.aico{background:rgba(31,166,152,.15);color:var(--atx)}
.dbtns .ayes{background:transparent;color:var(--atx);border:1.5px solid var(--abd);transition:background-color .2s,color .2s,border-color .2s}
.dbtns .ayes:hover,.dbtns .ayes:active,.dbtns .ayes:focus-visible{background:var(--arc);border-color:var(--arc);color:#fff}
@keyframes mpop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.f.lnk,.ep.lnk{cursor:pointer}
.k-o .chk svg{stroke:var(--on)}
:root[data-m="light"] .fav.f,:root[data-m="light"] .fav.g{--card2:#f2e6bf}
:root[data-m="light"] .fav .ep .more{background:rgba(255,255,255,.6)}
/* satırın tamamı gerçek bir bağlantı (butonlar üstte kalır) */
.rl{position:absolute;left:0;top:0;right:0;bottom:0;z-index:1;border-radius:inherit}
.f .chk,.f .more,.f .star,.f .rvb,.f .rt,.f .t,.ep .chk,.ep .more,.ep .t{position:relative;z-index:2}
/* koyu tema: yıldızlı dizinin bölümleri altın tonunda */
.fav.f,.fav.g{--card2:#312c1a}
.fav .ep .more{background:rgba(0,0,0,.28)}
.dlg p.err{color:var(--err)}
.dlg .sp{margin-bottom:4px}
.slink{margin-top:14px;background:none;border:0;color:var(--mut);font-size:.72em;text-decoration:underline;cursor:pointer}
/* platform dışında izlenenler (arşiv) */
:root{color-scheme:dark}
:root[data-m="light"]{color-scheme:light}
.pd{margin:22px 4px 0}
.pd-h{display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 2px;color:var(--mut);font-size:.82em;cursor:pointer;text-align:left;transition:color .2s}
.pd-h:hover{color:var(--tx)}
.pd-h svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.pd-h.open svg{transform:rotate(180deg)}
.pd-body{margin-top:8px;animation:fade .25s}
.pd-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

/* ---------- şifreleme ---------- */
var enc = new TextEncoder(), dec = new TextDecoder();
function b64e(buf) { var b = new Uint8Array(buf), s = ''; for (var i = 0; i < b.length; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, i + 8192)); return btoa(s); }

    .then(function (c) { return JSON.stringify({ v: 1, s: b64e(salt), i: b64e(iv), c: b64e(c) }); });
}
function decrypt(txt, p) {

/* ---------- GitHub ---------- */
function gh(method, body) {
  var o = { method: method, cache: 'no-store', headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + tok } };
  if (body) { o.body = JSON.stringify(body); o.headers['Content-Type'] = 'application/json'; }
  return fetch('https://api.github.com/repos/' + OWN + '/' + REPO + '/contents/data.json' + (method === 'GET' ? '?t=' + Date.now() : ''), o);
}
function loadRemote() {
  if (tok) {
    return gh('GET').then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error('GitHub hatası ' + r.status + (r.status === 401 ? ' (anahtar geçersiz)' : ''));
      return r.json().then(function (j) { return atob(j.content.replace(/\n/g, '')); });
    });
  }
  return fetch('data.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('Liste yüklenemedi (' + r.status + ')');
    return r.text();
  });
}
function saveNow() {
  return gh('GET').then(function (r) {
    if (r.status === 404) return null;

    return r.json().then(function (j) { return j.sha; });
  }).then(function (sha) {
    return encrypt(S, pw).then(function (txt) {
      var b = { message: 'liste güncellendi', content: btoa(txt) };
      if (sha) b.sha = sha;
      return gh('PUT', b);
    });
  }).then(function (r) { if (!r.ok) throw new Error('Kaydedilemedi (' + r.status + ')'); });
}
var timer;
function save() {
  if (!canEdit) return;
  clearTimeout(timer);
  timer = setTimeout(function () {
    saveNow().then(function () { toast('Kaydedildi ✓', true); }, function (e) { toast(e.message || 'Kaydedilemedi'); });
  }, 800);
}

/* ---------- izlendi durumu senkronu (ayrı gizli depo, parolayla şifreli) ---------- */
var W = {}, pend = {}, stEtag = '', stTimer, pollT;
function SYNCON() { return !!(S && S.sync && S.sync.r && S.sync.t); }
function sfetch(method, body, etag) {
  var h = { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + S.sync.t };
  if (body) h['Content-Type'] = 'application/json';
  if (etag) h['If-None-Match'] = etag;
  return fetch('https://api.github.com/repos/' + S.sync.r + '/contents/state.json', { method: method, cache: 'no-store', headers: h, body: body ? JSON.stringify(body) : undefined });
}
function stGet(force) {
  return sfetch('GET', null, force ? '' : stEtag).then(function (r) {
    if (r.status === 304) return { same: true };
    if (r.status === 404) return { sha: '', map: {}, etag: '' };
    if (!r.ok) throw new Error('Durum okunamadı (' + r.status + ')');
    var et = r.headers.get('ETag') || '';
    return r.json().then(function (j) {
      return decrypt(atob(j.content.replace(/\n/g, '')), pw).then(function (d) { return { sha: j.sha, map: (d && d.w) || {}, etag: et }; },
        function () { return { sha: j.sha, map: {}, etag: et }; });
    });
  });
}
function loadState(force) {
  if (!SYNCON()) return Promise.resolve(false);
  return stGet(force).then(function (o) {
    if (o.same) return false;
    stEtag = o.etag;
    var m = o.map, k; for (k in pend) m[k] = pend[k];
    var ch = JSON.stringify(m) !== JSON.stringify(W); W = m; return ch;
  });
}
function saveState() {
  clearTimeout(stTimer);
  stTimer = setTimeout(function () { stFlush(0).then(null, function (e) { toast((e && e.message) || 'Durum kaydedilemedi'); }); }, 700);
}
function stFlush(n) {
  if (!SYNCON()) return Promise.resolve();
  return stGet(true).then(function (o) {
    var m = o.map, snap = {}, k;
    for (k in pend) { m[k] = pend[k]; snap[k] = pend[k]; }
    return encrypt({ v: 1, w: m }, pw).then(function (txt) {
      var b = { message: 'durum', content: btoa(txt) }; if (o.sha) b.sha = o.sha;
      return sfetch('PUT', b);
    }).then(function (r) {
      if ((r.status === 409 || r.status === 422) && n < 2) return stFlush(n + 1);
      if (!r.ok) throw new Error('Durum kaydedilemedi (' + r.status + ')');
      for (k in snap) if (pend[k] === snap[k]) delete pend[k];
      W = m; stEtag = '';
    });
  });
}
function stWriteAll() {
  return stGet(true).then(function (o) {
    return encrypt({ v: 1, w: W }, pw).then(function (txt) {
      var b = { message: 'durum', content: btoa(txt) }; if (o.sha) b.sha = o.sha;
      return sfetch('PUT', b);
    });
  }).then(function (r) { if (!r.ok) throw new Error('Durum kaydedilemedi (' + r.status + ')'); stEtag = ''; });
}

/* ---------- ekranlar ---------- */
function show(w) { $('load').hidden = w !== 'load'; $('gate').hidden = w !== 'gate'; $('app').hidden = w !== 'app'; $('pwf').hidden = w !== 'pwf'; }
function gate(msg, bad) {
  var m = $('gmsg'); m.textContent = msg || 'Parolanı gir.'; m.className = bad ? 'err' : '';
  show('gate'); $('gp').focus();
}
function toast(m, ok) {
  var t = $('toast'); t.textContent = m; t.className = ok ? 'ok' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 3000);
}
function start() {
  show('load');
  if (!window.crypto || !crypto.subtle) { gate('Bu tarayıcı şifrelemeyi desteklemiyor.', true); return; }
  loadRemote().then(function (txt) {
    if (txt === null) {
      needSetup = true;
      return gate(tok ? 'İlk kurulum: bir parola belirle.' : 'Site henüz kurulmamış. Kurulum için düzenleme anahtarı gerekir.');
    }

    if (!pw) return gate('');
    return decrypt(txt, pw).then(function (d) { S = d; if (!S.items) S.items = []; canEdit = !!tok; return loadState(true).then(app, app); },
      function () { pw = ''; lset(PK, ''); gate('Parola yanlış.', true); });
  }).catch(function (e) { gate('Hata: ' + (e && e.message || e), true); });
}
$('gate').onsubmit = function (ev) {

var MK = 'izleme_tema', mode = ls(MK) || 'dark';
var IC = {
