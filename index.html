<!DOCTYPE html>
<html lang="tr" data-m="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>İzleme Listem</title>
<style>
:root{--bg:#0e1015;--card:#181b23;--card2:#222633;--tx:#eef0f6;--mut:#8a91a6;--acc:#7c9cff;--on:#0b1020;--ok:#3ddc84;--okt:#86cfa4;--okon:#07140c;--donebg:#14211b;--doneep:#173024;--err:#ff8a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-c="f"]{--bg:#150e0f;--card:#231819;--card2:#2f2022;--acc:#ff6b6b;--on:#1a0809}
:root[data-c="d"]{--bg:#0d1510;--card:#17231b;--card2:#1f3025;--acc:#3ddc84;--on:#07140c;--donebg:#0f2d1c;--doneep:#143a24}
:root[data-c="o"]{--bg:#15130c;--card:#231f14;--card2:#302a1b;--acc:#ffd24a;--on:#1a1400}
:root[data-c="t"]{--bg:#120e17;--card:#1e1825;--card2:#2a2234;--acc:#b58cff;--on:#150b24}
:root[data-m="light"]{--bg:#eef2fb;--card:#fff;--card2:#e4e9f5;--tx:#1b1e29;--mut:#6a7186;--acc:#4a6cf7;--on:#fff;--ok:#16a34a;--okt:#1f7a45;--okon:#fff;--donebg:#e0f4e8;--doneep:#cdeed9;--err:#d33a3a}
:root[data-m="light"][data-c="f"]{--bg:#fbeff0;--card2:#f6dfe1;--acc:#e5484d;--on:#fff}
:root[data-m="light"][data-c="d"]{--bg:#edf8f0;--card2:#d9efe1;--acc:#16a34a;--on:#fff;--donebg:#d2efde;--doneep:#bde6cd}
:root[data-m="light"][data-c="o"]{--bg:#fbf6e2;--card2:#f3eac3;--acc:#e0a400;--on:#1a1400}
:root[data-m="light"][data-c="t"]{--bg:#f4effb;--card2:#e7dcf6;--acc:#8b5cf6;--on:#fff}
html{background-color:var(--bg);transition:background-color .5s;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,.t,.k,.tab,.chk,.chev,.del,.mbtn{-webkit-user-select:none;user-select:none;touch-action:manipulation}
a{-webkit-touch-callout:none}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--tx);font:20px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:24px 18px 60px}
h1{font-size:2em;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px;font-size:.8em}
.tabs{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin:0 0 16px}
.tg{display:flex;gap:8px;flex-wrap:wrap}
.sep{width:2px;height:26px;border-radius:2px;background:var(--mut);opacity:.45}
button,input,select{font:inherit;color:inherit}
.tab{background:var(--card);border:2px solid transparent;border-radius:999px;padding:8px 18px;cursor:pointer}
.tab.on{background:var(--acc);color:var(--on);font-weight:600}
.add{display:none;gap:8px;flex-wrap:wrap;background:var(--card);padding:12px;border-radius:16px;margin:0 0 18px}
body.edit .add{display:flex}
.add input,.add select{background:var(--card2);border:2px solid transparent;border-radius:12px;padding:10px 12px;min-width:0}
.add .n{flex:2 1 200px}.add .u{flex:3 1 240px}
.add button{background:var(--acc);color:var(--on);border:0;border-radius:12px;padding:10px 20px;font-weight:700;cursor:pointer}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.f,.g{background:var(--card);border-radius:16px}
.f,.row,.ep{display:flex;align-items:center;gap:14px;padding:12px 14px}
.g.sdone,.f.done{background:var(--donebg)}
.chk{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid var(--mut);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;transition:background .25s,border-color .25s,transform .25s}
.chk svg{width:24px;height:24px;fill:none;stroke:var(--okon);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .35s .1s}
.done>.chk{background:var(--ok);border-color:var(--ok);transform:scale(1.08)}
.done>.chk svg{stroke-dashoffset:0}
.t{flex:1;min-width:0;color:var(--tx);text-decoration:none;word-break:break-word;padding:4px 2px;border-radius:8px;border:0;text-align:left;cursor:pointer;background:linear-gradient(var(--ok),var(--ok)) no-repeat 0 55%/0 3px;transition:background-size .45s,color .35s}
.done .t{background-size:100% 3px;color:var(--okt)}
.k{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;height:28px;padding:0 12px;font-size:.65em;color:var(--mut);border:1px solid var(--mut);border-radius:999px;text-decoration:none}
.k svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chev{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);border:0;color:var(--mut);cursor:pointer;padding:0;display:grid;place-items:center;justify-self:end}
.chev svg,.del svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chev svg{transition:transform .25s}
.g.open .chev svg{transform:rotate(180deg)}
.del{display:none;flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);border:0;color:var(--mut);cursor:pointer;padding:0;place-items:center;justify-self:end}
.ep .del{background:var(--card)}
body.edit .del{display:grid}
.del:hover{color:#ff6b6b}
.eps{display:none;padding:0 12px 12px 30px;animation:fade .25s}
.g.open .eps{display:block}
.eps ul{gap:6px}
.ep{background:var(--card2);border-radius:12px;padding:8px 12px}
.ep.done{background:var(--doneep)}
.ep .chk{width:34px;height:34px}.ep .chk svg{width:20px;height:20px}
.eps .add{margin:10px 0 0;background:transparent;padding:0}
.noep{color:var(--mut);font-size:.8em;padding:4px 2px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.main{flex:1;min-width:0;display:flex;align-items:center;gap:14px}
.acts{display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:10px;padding:0 14px 12px 68px}
.bar{flex:1;height:8px;border-radius:999px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background-color:var(--acc);background-image:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.32));transition:width .6s cubic-bezier(.4,0,.2,1),background-color .4s}
.g.sdone .bar i{background-color:var(--ok)}
.pct{font-size:.62em;color:var(--mut);min-width:2.8em;text-align:right}
.sel{position:relative;flex:none}
.add .selbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:120px;background:var(--card2);color:var(--tx);border:2px solid transparent;border-radius:12px;padding:10px 14px;font-weight:400;cursor:pointer}
.selbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.sel.open .selbtn svg{transform:rotate(180deg)}
.add .sel.open .selbtn,.add .selbtn:focus-visible{border-color:var(--acc)}
.opts{position:absolute;left:0;top:calc(100% + 6px);min-width:100%;z-index:20;background:var(--card2);border-radius:14px;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.35);animation:fade .15s}
.add .opts button{display:block;width:100%;background:transparent;color:var(--tx);border:0;border-radius:10px;padding:10px 14px;text-align:left;font-weight:400;white-space:nowrap;cursor:pointer}
.add .opts button:hover{background:var(--card)}
.add .opts button.sel1{background:var(--acc);color:var(--on);font-weight:600}
.g>.row,.g>.prog{cursor:pointer}
:root{--dtx:#f08a82;--dbd:#a8332d;--dfill:#9b2020}
:root[data-m="light"]{--dtx:#b42318;--dbd:#e3a8a2;--dfill:#a82a24}
.ovl{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fadein .2s}
.dlg{width:100%;max-width:340px;background:var(--card);border:1px solid var(--card2);border-radius:22px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.dico{width:48px;height:48px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:rgba(190,45,45,.15);color:var(--dtx)}
.dico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dlg h2{font-size:1.05em;margin:0 0 6px}
.dlg p{margin:0;color:var(--mut);font-size:.8em;word-break:break-word}
.dbtns{display:flex;gap:10px;margin-top:20px}
.dbtns button{flex:1;height:44px;border-radius:14px;font-weight:600;cursor:pointer}
.dno{background:var(--card2);color:var(--tx);border:1.5px solid transparent}
.dyes{background:transparent;color:var(--dtx);border:1.5px solid var(--dbd);transition:background-color .2s,color .2s,border-color .2s}
.dyes:hover,.dyes:active,.dyes:focus-visible{background:var(--dfill);border-color:var(--dfill);color:#fff}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
/* Tümü ve İzlenmedi görünümünde her içerik kendi kategori renginde */
:root[data-c="a"] .k-f,:root[data-c="t"] .k-f{--card:#231819;--card2:#2f2022;--acc:#ff6b6b;--on:#1a0809}
:root[data-c="a"] .k-d,:root[data-c="t"] .k-d{--card:#17231b;--card2:#1f3025;--acc:#3ddc84;--on:#07140c;--donebg:#0f2d1c;--doneep:#143a24}
:root[data-c="a"] .k-o,:root[data-c="t"] .k-o{--card:#231f14;--card2:#302a1b;--acc:#ffd24a;--on:#1a1400}
:root[data-m="light"][data-c="a"] .k-f,:root[data-m="light"][data-c="t"] .k-f{--card:#fdeced;--card2:#f6dfe1;--acc:#e5484d;--on:#fff}
:root[data-m="light"][data-c="a"] .k-d,:root[data-m="light"][data-c="t"] .k-d{--card:#e6f5ec;--card2:#d3eddc;--acc:#16a34a;--on:#fff;--donebg:#cdeed9;--doneep:#bde6cd}
:root[data-m="light"][data-c="a"] .k-o,:root[data-m="light"][data-c="t"] .k-o{--card:#fbf3d6;--card2:#f3eac3;--acc:#e0a400;--on:#1a1400}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.tab,.add,.add input,.add select,.add button,.f,.g,.ep{transition:background-color .5s,color .5s}
.empty{color:var(--mut);text-align:center;padding:40px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#ff6b6b;color:#200;padding:10px 18px;border-radius:12px;display:none;font-size:.8em;max-width:90%}
#toast.ok{background:var(--ok);color:#07140c}
#load{max-width:420px;margin:12vh auto 0;padding:0 18px;color:var(--mut);text-align:center}
.scr{max-width:420px;margin:12vh auto 0;padding:0 18px}
.scr h1{font-size:1.6em}
.scr p{color:var(--mut);font-size:.8em;margin:0 0 14px}
.scr p.err{color:var(--err)}
.scr input{display:block;width:100%;background:var(--card2);border:2px solid transparent;border-radius:12px;padding:12px;margin:0 0 10px}
.scr label{display:block;font-size:.7em;color:var(--mut);margin:0 0 4px}
.scr button{width:100%;background:var(--acc);color:var(--on);border:0;border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
.scr .btns{display:flex;gap:10px}
.scr .btns button{flex:1}
.scr button.sec{background:var(--card2);color:var(--tx)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.top .sub{margin:0}
.mwrap{position:relative;flex:none}
.mbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);color:var(--mut);display:grid;place-items:center;cursor:pointer;padding:0}
.mbtn svg,.menu svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.menu{position:absolute;right:0;top:50px;z-index:10;min-width:220px;background:var(--card2);border-radius:14px;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.35);animation:fade .15s}
.menu button{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;padding:12px;border-radius:10px;cursor:pointer;text-align:left;font-size:.8em}
.menu button:hover{background:var(--card)}
@media(max-width:700px){body{font-size:17px}.wrap{padding:18px 12px 50px}h1{font-size:1.7em}.f,.row,.ep{gap:10px;padding:10px 12px}.chk{width:34px;height:34px}.chk svg{width:20px;height:20px}.ep .chk{width:30px;height:30px}.ep .chk svg{width:18px;height:18px}.tab{padding:6px 14px}.eps{padding:0 8px 10px 14px}.tabs{flex-direction:column;align-items:flex-start;gap:8px}.sep{display:none}.f,.row{align-items:flex-start}.main{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t d" "a c";gap:6px 8px;align-items:center}.main .t{grid-area:t;flex:none}.acts{display:contents}.meta{grid-area:a}.chev{grid-area:c}.del{grid-area:d}.k{font-size:.72em}.prog{padding:0 12px 12px 56px}.bar{height:6px}}
</style>
</head>
<body>
<div id="load">Yükleniyor…</div>
<form id="gate" class="scr" hidden>
  <h1>🔒 İzleme Listem</h1>
  <p id="gmsg"></p>
  <label for="gp">Parola</label>
  <input id="gp" type="password" autocomplete="current-password">
  <label for="gt">Düzenleme anahtarı (sadece telefon/PC'de, isteğe bağlı)</label>
  <input id="gt" type="password" autocomplete="off">
  <button type="submit">Giriş</button>
</form>
<form id="pwf" class="scr" hidden>
  <h1>🔑 Şifreyi Değiştir</h1>
  <p id="pmsg"></p>
  <label for="np">Yeni parola</label>
  <input id="np" type="password" autocomplete="new-password">
  <label for="np2">Yeni parola (tekrar)</label>
  <input id="np2" type="password" autocomplete="new-password">
  <div class="btns"><button type="button" id="pcancel" class="sec">Vazgeç</button><button type="submit">Kaydet</button></div>
</form>
<div class="wrap" id="app" hidden>
  <div class="top">
    <div><h1>🎬 İzleme Listem</h1><p class="sub" id="sub"></p></div>
    <div class="mwrap">
      <button id="mbtn" class="mbtn" type="button" aria-label="Menü"></button>
      <div id="menu" class="menu" hidden>
        <button id="mtheme" type="button"></button>
        <button id="mpw" type="button"></button>
        <button id="mout" type="button"></button>
      </div>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <form class="add" id="add">
    <input class="n" id="n" placeholder="Film Adı" required>
    <input class="u" id="u" placeholder="Bağlantı" inputmode="url">
    <div class="sel" id="ksel"><button type="button" id="kbtn" class="selbtn" aria-haspopup="listbox"><span id="kval">Film</span><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button><div class="opts" id="kopts" role="listbox" hidden></div></div>
    <button type="submit">Ekle</button>
  </form>
  <ul id="list"></ul>
</div>
<div class="ovl" id="dlg" hidden>
  <div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dtitle">
    <div class="dico"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg></div>
    <h2 id="dtitle">Silmek istiyor musun?</h2>
    <p id="dtxt"></p>
    <div class="dbtns"><button type="button" id="dno" class="dno">İptal</button><button type="button" id="dyes" class="dyes">Sil</button></div>
  </div>
</div>
<div id="toast"></div>
<script>
var PK = 'izleme_pw', TK = 'izleme_tok', LK = 'izleme_yerel_v1', OKEY = 'izleme_acik_v1';
var OWN = location.hostname.split('.')[0], REPO = location.pathname.split('/')[1] || '';
var S = { items: [] }, filter = 'all', canEdit = false, needSetup = false, local = {}, open = {}, pw = '', tok = '';
function ls(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lset(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
pw = ls(PK); tok = ls(TK);
try { local = JSON.parse(ls(LK) || '{}'); } catch (e) {}
try { open = JSON.parse(ls(OKEY) || '{}'); } catch (e) {}
var $ = function (id) { return document.getElementById(id); };

/* ---------- şifreleme ---------- */
var enc = new TextEncoder(), dec = new TextDecoder();
function b64e(buf) { var b = new Uint8Array(buf), s = ''; for (var i = 0; i < b.length; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, i + 8192)); return btoa(s); }
function b64d(s) { var r = atob(s), b = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) b[i] = r.charCodeAt(i); return b; }
function mkKey(p, salt) {
  return crypto.subtle.importKey('raw', enc.encode(p), 'PBKDF2', false, ['deriveKey']).then(function (k) {
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  });
}
function encrypt(obj, p) {
  var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  return mkKey(p, salt).then(function (k) { return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, enc.encode(JSON.stringify(obj))); })
    .then(function (c) { return JSON.stringify({ v: 1, s: b64e(salt), i: b64e(iv), c: b64e(c) }); });
}
function decrypt(txt, p) {
  var o = JSON.parse(txt);
  return mkKey(p, b64d(o.s)).then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(o.i) }, k, b64d(o.c)); })
    .then(function (b) { return JSON.parse(dec.decode(b)); });
}

/* ---------- GitHub ---------- */
function gh(method, body) {
  var o = { method: method, cache: 'no-store', headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + tok } };
  if (body) { o.body = JSON.stringify(body); o.headers['Content-Type'] = 'application/json'; }
  return fetch('https://api.github.com/repos/' + OWN + '/' + REPO + '/contents/data.json' + (method === 'GET' ? '?t=' + Date.now() : ''), o);
}
function loadRemote() {
  if (tok) {
    return gh('GET').then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error('GitHub hatası ' + r.status + (r.status === 401 ? ' (anahtar geçersiz)' : ''));
      return r.json().then(function (j) { return atob(j.content.replace(/\n/g, '')); });
    });
  }
  return fetch('data.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('Liste yüklenemedi (' + r.status + ')');
    return r.text();
  });
}
function saveNow() {
  return gh('GET').then(function (r) {
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('GitHub hatası ' + r.status);
    return r.json().then(function (j) { return j.sha; });
  }).then(function (sha) {
    return encrypt(S, pw).then(function (txt) {
      var b = { message: 'liste güncellendi', content: btoa(txt) };
      if (sha) b.sha = sha;
      return gh('PUT', b);
    });
  }).then(function (r) { if (!r.ok) throw new Error('Kaydedilemedi (' + r.status + ')'); });
}
var timer;
function save() {
  if (!canEdit) return;
  clearTimeout(timer);
  timer = setTimeout(function () {
    saveNow().then(function () { toast('Kaydedildi ✓', true); }, function (e) { toast(e.message || 'Kaydedilemedi'); });
  }, 800);
}

/* ---------- ekranlar ---------- */
function show(w) { $('load').hidden = w !== 'load'; $('gate').hidden = w !== 'gate'; $('app').hidden = w !== 'app'; $('pwf').hidden = w !== 'pwf'; }
function gate(msg, bad) {
  var m = $('gmsg'); m.textContent = msg || 'Parolanı gir.'; m.className = bad ? 'err' : '';
  show('gate'); $('gp').focus();
}
function toast(m, ok) {
  var t = $('toast'); t.textContent = m; t.className = ok ? 'ok' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 3000);
}
function start() {
  show('load');
  if (!window.crypto || !crypto.subtle) { gate('Bu tarayıcı şifrelemeyi desteklemiyor.', true); return; }
  loadRemote().then(function (txt) {
    if (txt === null) {
      needSetup = true;
      return gate(tok ? 'İlk kurulum: bir parola belirle.' : 'Site henüz kurulmamış. Kurulum için düzenleme anahtarı gerekir.');
    }
    needSetup = false;
    if (!pw) return gate('');
    return decrypt(txt, pw).then(function (d) { S = d; if (!S.items) S.items = []; canEdit = !!tok; app(); },
      function () { pw = ''; lset(PK, ''); gate('Parola yanlış.', true); });
  }).catch(function (e) { gate('Hata: ' + (e && e.message || e), true); });
}
$('gate').onsubmit = function (ev) {
  ev.preventDefault();
  var p = $('gp').value, t = $('gt').value.trim();
  if (!p) return;
  pw = p; if (t) tok = t;
  lset(PK, pw); lset(TK, tok);
  $('gp').value = ''; $('gt').value = '';
  if (needSetup) {
    if (!tok) { gate('Kurulum için düzenleme anahtarı gerekli.', true); return; }
    S = { items: [] }; canEdit = true; show('load');
    saveNow().then(function () { app(); }, function (e) { gate('Hata: ' + e.message, true); });
  } else start();
};
/* ---------- tema ve menü ---------- */
var MK = 'izleme_tema', mode = ls(MK) || 'dark';
var IC = {
  gear: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  key: '<svg viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>',
  out: '<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>'
};
function lightNow() { var h = new Date().getHours(); return h >= 7 && h < 19; }
function isLight() { return mode === 'light' || (mode === 'auto' && lightNow()); }
function applyTheme() {
  document.documentElement.setAttribute('data-m', isLight() ? 'light' : 'dark');
  $('mtheme').innerHTML = (isLight() ? IC.sun : IC.moon) + '<span>Tema: ' + ({ dark: 'Koyu', light: 'Açık', auto: 'Otomatik' })[mode] + '</span>';
}
$('mbtn').innerHTML = IC.gear;
$('mpw').innerHTML = IC.key + '<span>Şifreyi Değiştir</span>';
$('mout').innerHTML = IC.out + '<span>Çıkış Yap</span>';
$('mtheme').onclick = function () { mode = ({ dark: 'light', light: 'auto', auto: 'dark' })[mode]; lset(MK, mode); applyTheme(); };
$('mbtn').onclick = function (ev) { ev.stopPropagation(); $('menu').hidden = !$('menu').hidden; };
document.addEventListener('click', function (ev) { if (!$('menu').hidden && !$('menu').contains(ev.target)) $('menu').hidden = true; });
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' || ev.keyCode === 27) $('menu').hidden = true; });
$('mpw').onclick = function () {
  $('menu').hidden = true;
  if (!canEdit) { toast('Şifreyi değiştirmek için çıkış yapıp düzenleme anahtarıyla giriş yap.'); return; }
  $('pmsg').textContent = 'Yeni parolanı iki kere yaz. Unutursan liste geri getirilemez.'; $('pmsg').className = '';
  show('pwf'); $('np').focus();
};
$('mout').onclick = function () { $('menu').hidden = true; lset(PK, ''); lset(TK, ''); pw = ''; tok = ''; canEdit = false; S = { items: [] }; start(); };
$('pcancel').onclick = function () { $('np').value = ''; $('np2').value = ''; app(); };
$('pwf').onsubmit = function (ev) {
  ev.preventDefault();
  var a = $('np').value, b = $('np2').value, m = $('pmsg');
  if (a.length < 4 || a !== b) { m.textContent = a !== b ? 'Parolalar aynı değil.' : 'Parola en az 4 karakter olsun.'; m.className = 'err'; return; }
  var old = pw; pw = a; show('load');
  saveNow().then(function () { lset(PK, pw); $('np').value = ''; $('np2').value = ''; app(); toast('Şifre değiştirildi ✓', true); },
    function (e) { pw = old; app(); toast(e.message || 'Kaydedilemedi'); });
};
setInterval(applyTheme, 60000);
applyTheme();

/* ---------- liste ---------- */
var G1 = [['all','Tümü'],['todo','İzlenmedi']], G2 = [['Film','Film'],['Dizi','Dizi'],['Diğer','Diğer']];
var CL = { all: 'a', Film: 'f', Dizi: 'd', 'Diğer': 'o', todo: 't' };
var PH = { Film: 'Film Adı', Dizi: 'Dizi Adı', 'Diğer': 'Adı' };
var SVG = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var SVGX = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var SVGCH = '<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';
var SVGLINK = '<svg viewBox="0 0 24 24"><path d="M7 17L17 7M8 7h9v9"/></svg>';
var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 5); };
var fixUrl = function (u) { u = (u || '').trim(); return (u && !/^https?:\/\//i.test(u)) ? 'https://' + u : u; };

function isW(x) { return (x.id in local) ? local[x.id] : !!x.w; }
function eps(s) { return s.e || []; }
function doneS(s) { return eps(s).length ? eps(s).every(isW) : isW(s); }
function doneX(x) { return x.k === 'Dizi' ? doneS(x) : isW(x); }
function setW(x, v) {
  if (canEdit) { x.w = v; save(); }
  else { local[x.id] = v; lset(LK, JSON.stringify(local)); }
}
function stats() {
  var tot = 0, seen = 0, cat = (filter === 'Film' || filter === 'Dizi' || filter === 'Diğer');
  S.items.forEach(function (x) {
    if (cat && x.k !== filter) return;
    if (x.k === 'Dizi' && eps(x).length) { eps(x).forEach(function (e) { tot++; if (isW(e)) seen++; }); }
    else { tot++; if (isW(x)) seen++; }
  });
  $('sub').textContent = !tot ? '' : (filter === 'todo' ? (tot - seen) + ' izlenmeyi bekliyor' : seen + ' / ' + tot + ' izlendi');
}
function mkChk(fn) {
  var c = document.createElement('button');
  c.className = 'chk'; c.setAttribute('aria-label', 'İzlendi'); c.innerHTML = SVG; c.onclick = fn; return c;
}
function mkLink(x) {
  var a = document.createElement('a');
  a.className = 't'; a.textContent = x.t;
  if (x.u) { a.href = x.u; a.target = '_blank'; a.rel = 'noopener'; } else { a.tabIndex = -1; }
  return a;
}
function mkDel(fn) {
  var d = document.createElement('button');
  d.className = 'del'; d.innerHTML = SVGX; d.setAttribute('aria-label', 'Sil'); d.onclick = fn; return d;
}
function mkKind(t) { var k = document.createElement('span'); k.className = 'k'; k.textContent = t; return k; }

function buildFilm(x) {
  var li = document.createElement('li');
  li.className = 'f k-' + CL[x.k] + (isW(x) ? ' done' : '');
  li.appendChild(mkChk(function () { var v = !isW(x); setW(x, v); li.classList.toggle('done', v); stats(); }));
  var main = document.createElement('div'); main.className = 'main';
  var acts = document.createElement('div'); acts.className = 'acts';
  main.appendChild(mkLink(x));
  var meta = document.createElement('div'); meta.className = 'meta'; meta.appendChild(mkKind(x.k)); acts.appendChild(meta);
  acts.appendChild(mkDel(function () { askDel('"' + x.t + '" listeden kaldırılacak.', function () { S.items = S.items.filter(function (z) { return z.id !== x.id; }); render(); save(); }); }));
  main.appendChild(acts); li.appendChild(main);
  return li;
}

function buildSeries(s) {
  s.e = eps(s);
  var li = document.createElement('li'); li.className = 'g k-d' + (open[s.id] ? ' open' : '');
  var head = document.createElement('div'); head.className = 'row';
  var cnt = mkKind('');
  var prog = document.createElement('div'); prog.className = 'prog'; prog.hidden = !s.e.length;
  var bar = document.createElement('div'); bar.className = 'bar';
  var fill = document.createElement('i'); bar.appendChild(fill);
  var pct = document.createElement('span'); pct.className = 'pct';
  prog.appendChild(bar); prog.appendChild(pct);
  function pctOf() { return s.e.length ? Math.round(s.e.filter(isW).length * 100 / s.e.length) : (isW(s) ? 100 : 0); }
  var epEls = [];
  function sync(first) {
    var d = doneS(s), n = s.e.filter(isW).length, p = pctOf();
    head.classList.toggle('done', d); li.classList.toggle('sdone', d);
    cnt.textContent = s.e.length ? (n + '/' + s.e.length) : 'Dizi';
    epEls.forEach(function (q) { q.el.classList.toggle('done', isW(q.x)); });
    pct.textContent = '%' + p;
    if (!first) fill.style.width = p + '%';
    stats();
  }
  function tog() {
    open[s.id] = !open[s.id]; li.classList.toggle('open', !!open[s.id]);
    lset(OKEY, JSON.stringify(open));
  }
  var title = document.createElement('button');
  title.className = 't'; title.textContent = s.t;
  var chev = document.createElement('button');
  chev.className = 'chev'; chev.innerHTML = SVGCH; chev.tabIndex = -1; chev.setAttribute('aria-hidden', 'true');
  var main = document.createElement('div'); main.className = 'main';
  var acts = document.createElement('div'); acts.className = 'acts';
  head.appendChild(mkChk(function () {
    var v = !doneS(s);
    if (s.e.length) s.e.forEach(function (e) { setW(e, v); }); else setW(s, v);
    sync();
  }));
  main.appendChild(title);
  var meta = document.createElement('div'); meta.className = 'meta'; meta.appendChild(cnt);
  if (s.u) { var a = document.createElement('a'); a.className = 'k'; a.innerHTML = SVGLINK; a.setAttribute('aria-label', 'Bağlantıyı aç'); a.href = s.u; a.target = '_blank'; a.rel = 'noopener'; meta.appendChild(a); }
  acts.appendChild(meta);
  acts.appendChild(chev);
  acts.appendChild(mkDel(function () { askDel('"' + s.t + '"' + (s.e.length ? ' ve ' + s.e.length + ' bölümü' : '') + ' listeden kaldırılacak.', function () { S.items = S.items.filter(function (z) { return z.id !== s.id; }); render(); save(); }); }));
  main.appendChild(acts); head.appendChild(main);
  li.appendChild(head); li.appendChild(prog);
  li.onclick = function (ev) { if (ev.target.closest('.eps,.chk,.del,a')) return; tog(); };

  var box = document.createElement('div'); box.className = 'eps';
  if (s.e.length) {
    var ul = document.createElement('ul');
    s.e.forEach(function (e) {
      var el = document.createElement('li'); el.className = 'ep' + (isW(e) ? ' done' : '');
      el.appendChild(mkChk(function () { setW(e, !isW(e)); sync(); }));
      el.appendChild(mkLink(e));
      el.appendChild(mkDel(function () { askDel('"' + e.t + '" listeden kaldırılacak.', function () { s.e = s.e.filter(function (z) { return z.id !== e.id; }); render(); save(); }); }));
      ul.appendChild(el); epEls.push({ el: el, x: e });
    });
    box.appendChild(ul);
  } else {
    var no = document.createElement('div'); no.className = 'noep'; no.textContent = 'Henüz bölüm yok.'; box.appendChild(no);
  }
  var f = document.createElement('form'); f.className = 'add';
  var fn = document.createElement('input'); fn.className = 'n'; fn.placeholder = 'Bölüm ' + (s.e.length + 1);
  var fu = document.createElement('input'); fu.className = 'u'; fu.placeholder = 'Bağlantı'; fu.setAttribute('inputmode', 'url');
  var fb = document.createElement('button'); fb.type = 'submit'; fb.textContent = '+ Bölüm';
  f.appendChild(fn); f.appendChild(fu); f.appendChild(fb);
  f.onsubmit = function (ev) {
    ev.preventDefault();
    s.e.push({ id: uid(), t: fn.value.trim() || ('Bölüm ' + (s.e.length + 1)), u: fixUrl(fu.value), w: false });
    open[s.id] = true; lset(OKEY, JSON.stringify(open));
    render(); save();
  };
  box.appendChild(f);
  li.appendChild(box);
  sync(true);
  setTimeout(function () { fill.style.width = pctOf() + '%'; }, 40);
  return li;
}

function render() {
  document.documentElement.setAttribute('data-c', CL[filter]);
  var tabs = $('tabs'); tabs.textContent = '';
  function grp(list) {
    var g = document.createElement('div'); g.className = 'tg';
    list.forEach(function (x) {
      var b = document.createElement('button');
      b.className = 'tab' + (filter === x[0] ? ' on' : '');
      b.textContent = x[1];
      b.onclick = function () { filter = x[0]; render(); };
      g.appendChild(b);
    });
    tabs.appendChild(g);
  }
  grp(G1);
  var sp = document.createElement('span'); sp.className = 'sep'; tabs.appendChild(sp);
  grp(G2);
  var ul = $('list'); ul.textContent = '';
  var items = S.items.filter(function (x) {
    if (filter === 'all') return true;
    if (filter === 'todo') return !doneX(x);
    return x.k === filter;
  });
  stats();
  if (!items.length) {
    var e = document.createElement('li'); e.className = 'empty';
    e.textContent = S.items.length ? 'Bu filtrede bir şey yok.' : (canEdit ? 'Henüz bir şey yok. Yukarıdan ekle.' : 'Liste boş.');
    ul.appendChild(e); return;
  }
  items.forEach(function (x) { ul.appendChild(x.k === 'Dizi' ? buildSeries(x) : buildFilm(x)); });
}
function app() { document.body.classList.toggle('edit', canEdit); $('menu').hidden = true; show('app'); render(); }

var dOk = null;
function askDel(txt, ok) { $('dtxt').textContent = txt; dOk = ok; $('dlg').hidden = false; $('dno').focus(); }
function closeDlg() { $('dlg').hidden = true; dOk = null; }
$('dno').onclick = closeDlg;
$('dyes').onclick = function () { var f = dOk; closeDlg(); if (f) f(); };
$('dlg').onclick = function (ev) { if (ev.target === this) closeDlg(); };
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' || ev.keyCode === 27) closeDlg(); });
var curKind = 'Film';
function pickKind(v) {
  curKind = v; $('kval').textContent = v; $('n').placeholder = PH[v];
  $('kopts').hidden = true; $('ksel').classList.remove('open');
  Array.prototype.forEach.call($('kopts').children, function (b) { b.className = b.textContent === v ? 'sel1' : ''; });
}
['Film', 'Dizi', 'Diğer'].forEach(function (v) {
  var b = document.createElement('button'); b.type = 'button'; b.textContent = v; b.setAttribute('role', 'option');
  b.onclick = function () { pickKind(v); }; $('kopts').appendChild(b);
});
$('kbtn').onclick = function (ev) { ev.stopPropagation(); var o = $('kopts'); o.hidden = !o.hidden; $('ksel').classList.toggle('open', !o.hidden); };
document.addEventListener('click', function (ev) { if (!$('ksel').contains(ev.target)) { $('kopts').hidden = true; $('ksel').classList.remove('open'); } });
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' || ev.keyCode === 27) { $('kopts').hidden = true; $('ksel').classList.remove('open'); } });
pickKind('Film');
$('add').onsubmit = function (ev) {
  ev.preventDefault();
  var t = $('n').value.trim();
  if (!t) return;
  var k = curKind, x = { id: uid(), t: t, u: fixUrl($('u').value), k: k, w: false };
  if (k === 'Dizi') { x.e = []; open[x.id] = true; lset(OKEY, JSON.stringify(open)); }
  S.items.unshift(x);
  $('n').value = ''; $('u').value = '';
  render(); save();
};
start();
</script>
</body>
</html>
